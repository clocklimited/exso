name: CI

on:
  [push]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Get NODE_VERSION
        run: echo "NODE_VERSION=$(cat .naverc)" >> $GITHUB_ENV
      -
        name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install Yarn
        run: npm i -g yarn@1.22.22

      - name: Yarn Cache Directory Path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v5
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION  }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.NODE_VERSION  }}

      -
        name: Install Dependencies
        run: yarn install --frozen-lockfile --silent --no-emoji --prefer-offline

      -
        name: Quality Assurance
        run: yarn qa

      -
        name: Tests
        run: yarn test

      - name: Build Docker image
        run: docker build -t exso:ci .
